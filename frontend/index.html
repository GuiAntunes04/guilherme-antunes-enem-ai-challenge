<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo-mark.png" />
    <link rel="apple-touch-icon" href="/brand/logo-mark.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#080c14" />
    <script>
      ;(function () {
        var key = 'enem-prep-theme'
        var pref = localStorage.getItem(key)
        var resolved =
          pref === 'light'
            ? 'light'
            : pref === 'dark'
              ? 'dark'
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        document.documentElement.setAttribute('data-theme', resolved)
        document.documentElement.style.colorScheme = resolved
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', resolved === 'light' ? '#f1f5f9' : '#080c14')
      })()
    </script>
    <meta
      name="description"
      content="Simulados, tutor IA e correção de redação para o ENEM."
    />
